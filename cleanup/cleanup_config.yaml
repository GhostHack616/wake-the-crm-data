# =============================================================
# Configuration du cleanup — Wake the CRM
# Exigence du brief : "config, pas code" — chaque règle vit ici.
# Le script run_cleanup.py lit ce fichier et ne contient que la mécanique.
# =============================================================

# NOW du dataset = timestamp du dernier event. Jamais la date système.
reference_date: "2026-07-22"

# --- Étape 1 : les dates -------------------------------------
# 3 formats coexistent dans les colonnes de dates :
#   - ISO                : 2022-12-13
#   - année à 2 chiffres : MM/DD/YY   (format américain)
#   - année à 4 chiffres : DD/MM/YYYY (format français)
# Règle prouvée sur ~90 000 dates, 0 contre-exemple :
#   le nombre de chiffres de l'année discrimine les deux formats slash.
dates:
  columns:
    accounts: [created_date, last_activity_date, renewal_date]
    contacts: [created_date]
  # bornes de vraisemblance (le CRM a 8 ans ; les renewals vont jusqu'à mi-2027)
  plausible_years: [2018, 2028]

# --- Étape 2 : les pays --------------------------------------
# 30 graphies observées pour 8 pays réels. Normalisation vers le code
# ISO 3166-1 (standard international à 2 lettres). La table ci-dessous
# est LA règle : une graphie absente de la table n'est JAMAIS devinée,
# elle sort en "non mappée" dans le rapport d'audit.
countries:
  canonical:
    FR: France
    BE: Belgique
    NL: Pays-Bas
    DE: Allemagne
    IT: Italie
    ES: Espagne
    CH: Suisse
    GB: Royaume-Uni
  # clé = graphie brute en minuscules (après trim)
  mapping:
    fr: FR
    france: FR
    be: BE
    belgique: BE
    belgium: BE
    nl: NL
    netherlands: NL
    nederland: NL
    pays-bas: NL
    de: DE
    allemagne: DE
    germany: DE
    it: IT
    italie: IT
    italy: IT
    es: ES
    espagne: ES
    spain: ES
    ch: CH
    suisse: CH
    switzerland: CH
    gb: GB
    uk: GB
    united kingdom: GB

# --- Étape 3 : les domaines ----------------------------------
# Nettoyage : minuscules + retrait des préfixes listés (www.).
# Racine = partie avant l'extension (acme.com -> acme) : c'est la
# clé n°1 de détection des doublons (étape 7).
# Toute extension hors de la liste attendue sort dans le rapport
# au lieu d'être traitée en silence.
domains:
  strip_prefixes: ["www."]
  known_tlds: [com, fr, eu, co, io]
  # Inférence des domaines manquants (2 671 fiches sans domaine) :
  # racine déduite des emails PRO des contacts, uniquement si tous les
  # contacts pointent vers la MÊME racine (unanimité — 0 cas ambigu mesuré).
  # Traçée dans domain_source='inferred_from_contacts'.
  # Validée : racine(domaine déclaré) = racine(emails) sur 25 785/25 785 comptes.
  personal_email_domains: [gmail.com]

# --- Étape 4 : les noms --------------------------------------
# name_norm = minuscules -> retrait des marqueurs de doublon
# ('(old)', '- import', ' 2' final) -> retrait itératif des mentions
# juridiques/décoratives en fin de nom -> retrait espaces/ponctuation.
# C'est la clé n°2 de la fusion (couvre les 133 fiches sans racine).
# Validation : name_norm doit être IDENTIQUE à domain_root sur 100 %
# des fiches à domaine déclaré (l'audit a mesuré 27 329/27 329).
names:
  legal_suffixes: [sas, sa, sarl, gmbh, bv, ltd, spa, ab, oy, as, sl,
                   group, france, "& co", and co]

# --- Le filet : les invariants ------------------------------
# Des vérités qui doivent rester vraies après CHAQUE exécution.
# Vérifiées automatiquement en fin de pipeline : un seul rouge = alarme
# et le pipeline s'arrête en erreur. 4 familles : conservation,
# cohérence, non-régression (s'arme aux étapes 7+), bornes de sanité.
invariants:
  conservation:
    accounts_rows: 30000
    contacts_rows: 77199
    events_rows: 94838
    # colonnes d'origine jamais écrasées (proxies mesurés à l'audit)
    accounts_domain_non_vide: 27329
    accounts_country_graphies_distinctes: 30
    accounts_nom_non_vide: 30000
  coherence:
    dates_erreurs_parsing: 0
    renewal_date_remplies: 3386        # = 3 346 customers + 40 churned contradictoires
    events_form_fill: 16
    events_meeting_booked: 9
    concordance_nom_racine_declares: 27329   # name_norm == domain_root, 100 % exigé
  sanite:
    domaines_declares: 27329
    racines_deduites: 2538
    fiches_sans_racine: 133      # couvre aussi "0 déduction ambiguë" (un cas ambigu → 134)
    www_retires: 1825
    longueur_racine_min: 6
    noms_marques: 234                # (old) 80 + '- import' 80 + ' 2' 74
    noms_distincts_min: 19000        # borne basse future table entreprises
    noms_distincts_max: 22000        # borne haute
  # S'armeront automatiquement avec leurs étapes :
  a_armer:
    - "étape 7 : entités finales entre 19 000 et 22 000"
    - "étape 7 : aucune entité ne regroupe plus de 5 fiches"
    - "étape 7 : écart de somme ARR = exactement les doublons écartés, listés"
    - "étape 8 : chaque event rattaché à exactement une entité"
    - "étape 9 : events dédupliqués flagués, jamais supprimés (94 838 conservés)"
    - "étape 10 : le bot CON-077194 toujours flagué"
    - "étape 11+ : ACC-027283 (pages résiliation) jamais en HOT"
    - "étape 11+ : aucun contact opted_out dans une liste d'envoi"
