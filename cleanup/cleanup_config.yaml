# =============================================================
# Configuration du cleanup — Wake the CRM
# Exigence du brief : "config, pas code" — chaque règle vit ici.
# Le script run_cleanup.py lit ce fichier et ne contient que la mécanique.
# =============================================================

# NOW du dataset = timestamp du dernier event. Jamais la date système.
reference_date: "2026-07-22"

# --- Étape 1 : les dates -------------------------------------
# 3 formats coexistent dans les colonnes de dates :
#   - ISO                : 2022-12-13
#   - année à 2 chiffres : MM/DD/YY   (format américain)
#   - année à 4 chiffres : DD/MM/YYYY (format français)
# Règle prouvée sur ~90 000 dates, 0 contre-exemple :
#   le nombre de chiffres de l'année discrimine les deux formats slash.
dates:
  columns:
    accounts: [created_date, last_activity_date, renewal_date]
    contacts: [created_date]
  # bornes de vraisemblance (le CRM a 8 ans ; les renewals vont jusqu'à mi-2027)
  plausible_years: [2018, 2028]

# --- Étape 2 : les pays --------------------------------------
# 30 graphies observées pour 8 pays réels. Normalisation vers le code
# ISO 3166-1 (standard international à 2 lettres). La table ci-dessous
# est LA règle : une graphie absente de la table n'est JAMAIS devinée,
# elle sort en "non mappée" dans le rapport d'audit.
countries:
  canonical:
    FR: France
    BE: Belgique
    NL: Pays-Bas
    DE: Allemagne
    IT: Italie
    ES: Espagne
    CH: Suisse
    GB: Royaume-Uni
  # clé = graphie brute en minuscules (après trim)
  mapping:
    fr: FR
    france: FR
    be: BE
    belgique: BE
    belgium: BE
    nl: NL
    netherlands: NL
    nederland: NL
    pays-bas: NL
    de: DE
    allemagne: DE
    germany: DE
    it: IT
    italie: IT
    italy: IT
    es: ES
    espagne: ES
    spain: ES
    ch: CH
    suisse: CH
    switzerland: CH
    gb: GB
    uk: GB
    united kingdom: GB

# --- Étape 3 : les domaines ----------------------------------
# Nettoyage : minuscules + retrait des préfixes listés (www.).
# Racine = partie avant l'extension (acme.com -> acme) : c'est la
# clé n°1 de détection des doublons (étape 7).
# Toute extension hors de la liste attendue sort dans le rapport
# au lieu d'être traitée en silence.
domains:
  strip_prefixes: ["www."]
  known_tlds: [com, fr, eu, co, io]
  # Inférence des domaines manquants (2 671 fiches sans domaine) :
  # racine déduite des emails PRO des contacts, uniquement si tous les
  # contacts pointent vers la MÊME racine (unanimité — 0 cas ambigu mesuré).
  # Traçée dans domain_source='inferred_from_contacts'.
  # Validée : racine(domaine déclaré) = racine(emails) sur 25 785/25 785 comptes.
  personal_email_domains: [gmail.com]

# --- Étape 4 : les noms --------------------------------------
# name_norm = minuscules -> retrait des marqueurs de doublon
# ('(old)', '- import', ' 2' final) -> retrait itératif des mentions
# juridiques/décoratives en fin de nom -> retrait espaces/ponctuation.
# C'est la clé n°2 de la fusion (couvre les 133 fiches sans racine).
# Validation : name_norm doit être IDENTIQUE à domain_root sur 100 %
# des fiches à domaine déclaré (l'audit a mesuré 27 329/27 329).
names:
  legal_suffixes: [sas, sa, sarl, gmbh, bv, ltd, spa, ab, oy, as, sl,
                   group, france, "& co", and co]

# --- Étape 5 : les emails ------------------------------------
# Réparations MÉCANIQUES uniquement (rien d'inventé) : espaces internes
# retirés, @@ réduit à @. Mesuré : 0 chevauchement entre adresses cassées
# et adresses perso. email_status = ok | repaired | missing | personal.
# Doublons d'adresses flagués ici (783 adresses / 1 940 porteurs) —
# anti-double-comptage du buying committee (une personne = un contact).
emails:
  # tout email dont le domaine matche la watchlist SANS être dans
  # domains.personal_email_domains sort en alerte (jamais en silence)
  freemail_watchlist: [yahoo.com, yahoo.fr, hotmail.com, hotmail.fr,
                       outlook.com, outlook.fr, live.com, live.fr,
                       free.fr, orange.fr, wanadoo.fr, sfr.fr, laposte.net,
                       gmx.com, gmx.de, gmx.fr, web.de, icloud.com, me.com,
                       protonmail.com, proton.me, aol.com]

# --- Étape 6 : dates impossibles & cohérence ------------------
# Règle : une date fausse n'entre JAMAIS dans un calcul — on ne "corrige"
# pas (la vraie valeur est inconnaissable), on NEUTRALISE (date parsée
# vidée) et on TRACE (flag). Les events, eux, ne sont jamais touchés.
# Flags contacts (created_date_flag) :
#   future                  = créé après le 22/07/2026 (jusqu'à nov. 2027 !)
#   emails_avant_creation   = a REÇU des emails avant sa création -> date corrompue
#   visites_avant_creation  = seulement visites/linkedin avant création
#                             -> attribution rétroactive possible, bénéfice du doute
# Flag comptes (last_activity_flag) : future = dernière activité après le 22/07.

# --- Étape 7 : LA FUSION -------------------------------------
# 30 000 fiches -> 20 519 entreprises. Clé = name_norm (== domain_root
# à 100 %, partitions identiques prouvées par 2 clés indépendantes).
# Élection de la fiche maîtresse : marqueur EXCLU d'abord, puis cascade
# de statuts, puis ARR rempli, puis la plus ancienne.
# Consolidation : statut = le plus avancé DU GROUPE (pas de la maîtresse) ;
# ARR + renewal pris ENSEMBLE sur la même fiche (customer d'abord, puis
# churned, renewal la plus tardive) ; dernière activité = MAX du groupe ;
# création = MIN du groupe ; pays = vote majoritaire ; conflits -> flags,
# jamais tranchés en silence. Rien n'est supprimé (merged_into partout).
fusion:
  cascade_statuts: [customer, churned, opportunity, prospect, lead, lost]

# --- Personas : titre -> tier (PARAMÈTRE DE SCORING) ---------
# Figé après 4 rounds de contre-vérification croisée.
# Buyers organisés par MODULE PRODUIT : chaque titre inclus a une raison
# produit (il choisit/budgète un module), chaque exclu a une raison.
# PORTÉE BORNÉE : le tier sert à compter le comité d'achat et à pondérer
# les signaux FAIBLES (clic, visite, open). PLANCHER : un event de
# conversion (form_fill, meeting_booked) vaut son poids plein quel que
# soit le porteur — le décideur déclare l'intention (13/16 form_fills),
# l'opérationnel organise la logistique (9/9 RDV sans aucun buyer).
personas:
  buyers:
    ats: [Head of Talent Acquisition]
    performance: [CHRO, Chief People Officer, Head of People, VP People]
    paie_sirh: [HR Director, Directeur RH, Directrice RH, VP Human Resources,
                Head of HR Operations]
    transverse: [CEO, COO]
  champions: [HR Manager, HRBP, HR Business Partner, People Ops Manager,
              Talent Acquisition Manager, "Compensation & Benefits Manager",
              Responsable Recrutement]
  utilisateurs: [Chargee de recrutement, Charge de recrutement, Recruiter,
                 HR Officer, Talent Acquisition Specialist,
                 People Ops Coordinator, HR Assistant]
  bruit: [Executive Assistant, HR Intern, Office Manager]

# --- Étape 8 : le ré-attachement -----------------------------
# Contacts et events rejoignent leurs entités. Orphelins : rattachés par
# le domaine de leur email quand il désigne UNE entité (même geste que
# l'étape 3, tracé entity_source=inferred_from_email) ; les vrais
# inconnus deviennent la liste "comptes à créer". Dédup des PERSONNES
# au sein d'une entité (même email = même personne, primaire + copies
# flaguées, rien de supprimé).

# --- Le filet : les invariants ------------------------------
# Des vérités qui doivent rester vraies après CHAQUE exécution.
# Vérifiées automatiquement en fin de pipeline : un seul rouge = alarme
# et le pipeline s'arrête en erreur. 4 familles : conservation,
# cohérence, non-régression (s'arme aux étapes 7+), bornes de sanité.
invariants:
  conservation:
    accounts_rows: 30000
    contacts_rows: 77199
    events_rows: 94838
    # colonnes d'origine jamais écrasées (proxies mesurés à l'audit)
    accounts_domain_non_vide: 27329
    accounts_country_graphies_distinctes: 30
    accounts_nom_non_vide: 30000
  coherence:
    dates_erreurs_parsing: 0
    renewal_date_remplies: 3386        # = 3 346 customers + 40 churned contradictoires
    events_form_fill: 16
    events_meeting_booked: 9
    concordance_nom_racine_declares: 27329   # name_norm == domain_root, 100 % exigé
  sanite:
    domaines_declares: 27329
    racines_deduites: 2538
    fiches_sans_racine: 133      # couvre aussi "0 déduction ambiguë" (un cas ambigu → 134)
    www_retires: 1825
    longueur_racine_min: 6
    noms_marques: 234                # (old) 80 + '- import' 80 + ' 2' 74
    noms_distincts_min: 19000        # borne basse future table entreprises
    noms_distincts_max: 22000        # borne haute
    emails_repares: 1544             # 769 @@ + 775 espaces
    emails_invalides_apres_reparation: 0
    adresses_email_partagees: 783    # même adresse = même personne, flag anti double-comptage
    contacts_dates_futures: 6321
    contacts_emails_avant_creation: 414
    contacts_visites_avant_creation: 20
    accounts_last_activity_future: 3
    dates_parsees_futures_restantes: 0   # après neutralisation, plus aucune date > NOW
    # L'équilibre qui rend visible la dépendance clé↔marqueurs (ajout IA n°2) :
    # la propriété "zéro fusion transitive" repose sur le retrait des marqueurs.
    # Si quelqu'un touche la regex des marqueurs, cet équilibre casse et alarme.
    noms_distincts_marqueurs_inclus: 20753   # 20 753 − 234 marqueurs = 20 519 entités
  # Armés à l'étape 7 (LA FUSION) :
  fusion:
    entites: 20519                   # exact, triple-prouvé
    taille_groupe_max: 4
    fiches_marquees_elues: 0         # absolu — le marqueur exclut d'office
    arr_total_fiches: 69681000       # conservation, à l'euro près
    conflits_pays: 5947
    conflits_arr: 251
    conflits_owner: 5067
    conflits_lifecycle: 6858
    arbitrages_churned_opportunity: 80
    corroboration_racine_declaree: 226   # invariant n°28 : toute fusion déclenchée
    corroboration_racine_deduite: 8      # par un marqueur a une 2e preuve indépendante
    fusions_marqueur_seul: 0             # zéro fusion sur le seul marqueur
    # Piège n°11 (ARR fantôme) : l'agrégat comptable sépare actif / ex-client.
    # SUM(arr_eur) brut = 66,6 M€ mais 21,9 % est porté par des ex-clients.
    arr_actif: 52032000                  # SUM(arr_eur) où lifecycle = customer
    arr_ex_client: 14624000              # SUM(arr_eur) où lifecycle = churned (win-back)

  # Armés avec les personas (partition complète 77 199, double sens) :
  personas:
    buyers: 16561
    champions: 19701
    utilisateurs: 25573
    bruit: 10799
    sans_titre: 4565
    libelles_fantomes: 0        # chaque titre du mapping existe dans la base
    titres_non_classes: 0       # chaque titre de la base a exactement un tier

  # Armés à l'étape 8 (ré-attachement) :
  reattachement:
    contacts_avec_entite: 77146          # 76 599 par compte + 547 par email
    orphelins_rattaches_email: 547
    vrais_inconnus: 53                   # -> liste "comptes à créer"
    inconnus_avec_events: 0
    events_avec_entite: 90838
    events_anonymes: 4000                # 90 838 + 4 000 = 94 838
    events_reparentes: 29184             # 32,1 % des rattachables
    contacts_reparentes: 24230
    # 97 mesurés AVANT le rattachement des orphelins ; +2 RÉVÉLÉS par lui
    # (un orphelin dont l'email existe déjà sur un contact de la même entité
    # = la même personne débranchée — ex. manon.simon@fabripharma.com).
    # Écart détecté par l'alarme du filet, expliqué, puis verrouillé.
    couples_dedup_personnes: 99          # (entité, email) portés par >= 2 fiches
    copies_flaguees: 99                  # duplicate_of posé
    emails_multi_entites: 678
    faux_clusters_restants: 0            # 0 entité où 2 "personnes distinctes" partagent un email

  # S'armeront automatiquement avec leurs étapes :
  a_armer:
    - "étape 9 : events dédupliqués flagués, jamais supprimés (94 838 conservés)"
    - "étape 10 : le bot CON-077194 toujours flagué"
    - "étape 11+ : ACC-027283 (pages résiliation) jamais en HOT"
    - "étape 11+ : aucun contact opted_out dans une liste d'envoi"

# --- Traçabilité : règle actée -> invariant qui la surveille --
# Née de l'erreur n°7 (règle ARR actée mais non implémentée, non surveillée).
# Une ligne SANS invariant = un trou visible d'un coup d'œil, au lieu d'être
# découvert par hasard. Rendue dans le rapport à chaque exécution.
tracabilite:
  - {regle: "Dates 3 formats, année 2 ch.=US / 4 ch.=FR, jamais devinées",       ou: "étape 1",             invariants: "K1, S15"}
  - {regle: "Pays normalisés ISO, graphie inconnue jamais devinée",              ou: "étape 2",             invariants: "C5 + contrôle non-mappées=0"}
  - {regle: "Racine de domaine = clé n°1 ; inférence UNANIME tracée",            ou: "étape 3",             invariants: "S1-S5"}
  - {regle: "Nom normalisé = clé n°2 ; marqueurs jamais maîtres",                ou: "étapes 4+7",          invariants: "S6, S7, K5, S16, F3"}
  - {regle: "Emails : réparation mécanique seule ; doublons de personnes flagués", ou: "étape 5",           invariants: "S8-S10"}
  - {regle: "Date fausse neutralisée + tracée, jamais corrigée",                 ou: "étape 6",             invariants: "S11-S15"}
  - {regle: "Fusion : 20 519 entités, conflits flagués jamais tranchés en silence", ou: "étape 7",          invariants: "F1-F14"}
  - {regle: "ARR comptable = customers uniquement (piège n°11)",                 ou: "étape 7 (arr_actif)", invariants: "F15-F17"}
  - {regle: "Rien n'est supprimé, rollback intégral",                            ou: "toutes",              invariants: "C1-C6, F4 + merged_into"}
  - {regle: "Le routage lit les FAITS (a_ete_client/deal_en_cours), pas l'étiquette", ou: "routage (à venir)", invariants: ""}
  - {regle: "email_sent pèse 0, opens ≈ 0 dans le score",                        ou: "scoring (à venir)",   invariants: ""}
  - {regle: "/careers et /blog à poids nul",                                     ou: "scoring (à venir)",   invariants: ""}
  - {regle: "Pages négatives (cancel/billing/export) à poids négatif",           ou: "scoring (à venir)",   invariants: ""}
  - {regle: "Opt-out : interdit d'écrire ≠ signal annulé (suppression list)",    ou: "scoring/push (à venir)", invariants: ""}
  - {regle: "Aucun filtre dur avant scoring (test d'amputation)",                ou: "scoring (à venir)",   invariants: ""}
  - {regle: "Decay demi-vie courte + plancher 21 j",                             ou: "scoring (à venir)",   invariants: ""}
  - {regle: "Le silence des clients EST un score (file risque churn)",           ou: "routage (à venir)",   invariants: ""}
  - {regle: "Bot détecté au chronomètre (cadence), jamais au volume",            ou: "étape 10 (à venir)",  invariants: ""}
  - {regle: "Récence = events uniquement, jamais last_activity_date",            ou: "scoring (à venir)",   invariants: ""}
  - {regle: "Buying committee = personnes distinctes (dédup email)",             ou: "étape 8",             invariants: "R9-R11"}
  - {regle: "Chaque event/contact rattaché à exactement une entité (anonymes/inconnus tracés)", ou: "étape 8", invariants: "R1-R8"}
  - {regle: "Mapping persona produit, partition complète double sens",           ou: "config personas",     invariants: "P1-P7"}
  - {regle: "Plancher conversions : form_fill/meeting_booked à poids plein quel que soit le porteur", ou: "scoring (à venir)", invariants: ""}
